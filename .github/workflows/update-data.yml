name: Update Macro Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get BLS data
        shell: bash
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "seriesid": [
                "CES0000000001",
                "LNS14000000",
                "JTS000000000000000JOR"
              ],
              "startyear": "2026",
              "endyear": "2026"
            }' \
            "https://api.bls.gov/publicAPI/v2/timeseries/data/")

          echo "$RESPONSE" > bls_response.json

      - name: Get Initial Jobless Claims
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

          curl -L -s \
            -A "Mozilla/5.0" \
            "https://www.dol.gov/ui/data.pdf" \
            -o claims.pdf

          pdftotext -layout claims.pdf claims.txt

          python - <<'PY'
          import re
          import json

          with open(
              "claims.txt",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              text = f.read()

          patterns = [
              r'advance figure for seasonally adjusted initial claims was\s+([\d,]+)',
              r'seasonally adjusted initial claims was\s+([\d,]+)'
          ]

          value = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  re.I | re.S
              )

              if match:
                  value = int(
                      match.group(1).replace(",", "")
                  )
                  break

          if value is None:
              raise RuntimeError(
                  "Could not extract Initial Jobless Claims "
                  "from the official DOL Weekly Claims PDF."
              )

          date_match = re.search(
              r'week ending\s+([A-Z][a-z]+\s+\d{1,2},\s+\d{4})',
              text,
              re.I
          )

          week_ending = (
              date_match.group(1)
              if date_match
              else None
          )

          claims = {
              "value": value,
              "week_ending": week_ending,
              "source": "U.S. Department of Labor - ETA",
              "release_url": "https://www.dol.gov/ui/data.pdf"
          }

          with open("claims_data.json", "w") as f:
              json.dump(claims, f, indent=2)

          print("Initial Jobless Claims:")
          print(json.dumps(claims, indent=2))
          PY

      - name: Get ADP data
        shell: bash
        run: |
          curl -L -s \
            -A "Mozilla/5.0" \
            "https://mediacenter.adp.com/press-releases?l=50" \
            -o adp_releases.html

          python - <<'PY'
          import re
          import json
          import html
          from urllib.parse import urljoin

          with open(
              "adp_releases.html",
              "r",
              encoding="utf-8"
          ) as f:
              page = f.read()

          page = html.unescape(page)

          pattern = re.compile(
              r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>\s*'
              r'ADP\s+National\s+Employment\s+Report[^<]*',
              re.I | re.S
          )

          links = pattern.findall(page)

          if not links:
              raise RuntimeError(
                  "Could not find an ADP National Employment Report "
                  "on the ADP Press Releases page."
              )

          release_url = urljoin(
              "https://mediacenter.adp.com/",
              links[0]
          )

          print("ADP release URL:")
          print(release_url)

          import urllib.request

          request = urllib.request.Request(
              release_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              release_html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          release_html = html.unescape(release_html)

          patterns = [
              r'Change in U\.S\. Private Employment:\s*'
              r'([+-]?\s*[\d,]+)',

              r'Private employers added\s+'
              r'([\d,]+)\s+jobs',

              r'Private-sector employment increased by\s+'
              r'([\d,]+)\s+jobs'
          ]

          value = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  release_html,
                  re.I | re.S
              )

              if match:
                  value = int(
                      match.group(1)
                      .replace(",", "")
                      .replace(" ", "")
                  )
                  break

          if value is None:
              raise RuntimeError(
                  "ADP release was found, but the employment value "
                  "could not be extracted."
              )

          title_match = re.search(
              r'<title[^>]*>(.*?)</title>',
              release_html,
              re.I | re.S
          )

          title = ""

          if title_match:
              title = re.sub(
                  r'<[^>]+>',
                  '',
                  title_match.group(1)
              ).strip()

          month_match = re.search(
              r'(January|February|March|April|May|June|July|August|'
              r'September|October|November|December)\s+2026',
              title,
              re.I
          )

          month = (
              month_match.group(0)
              if month_match
              else None
          )

          adp = {
              "value": value,
              "month": month,
              "source": "ADP National Employment Report",
              "release_url": release_url
          }

          with open("adp_data.json", "w") as f:
              json.dump(adp, f, indent=2)

          print("ADP data:")
          print(json.dumps(adp, indent=2))
          PY

      - name: Build macro.json
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          import os

          with open(
              "bls_response.json",
              "r"
          ) as f:
              data = json.load(f)

          with open(
              "adp_data.json",
              "r"
          ) as f:
              adp_data = json.load(f)

          with open(
              "claims_data.json",
              "r"
          ) as f:
              claims_data = json.load(f)

          os.makedirs(
              "data",
              exist_ok=True
          )

          result = {
              "status": "live",

              "updated":
                  datetime.now(timezone.utc).isoformat(),

              "source": {
                  "bls": "https://www.bls.gov/",
                  "adp": "https://mediacenter.adp.com/press-releases?l=50",
                  "claims": "https://www.dol.gov/ui/data.pdf",
                  "nfib": "https://www.nfib.com/"
              },

              "nfp": None,

              "unemployment": None,

              "jolts": None,

              "claims": claims_data,

              "adp": adp_data,

              "nfib": {
                  "employment_index": 101.8,
                  "month": "August 2026",
                  "source": "NFIB Small Business Employment Index"
              },

              "ism": None,

              "indeed": None,

              "cpi": {
                  "mom": 0.36,
                  "core_mom": 0.19,
                  "yoy": 3.41,
                  "core_yoy": 2.32,
                  "source": "Cleveland Fed"
              }
          }

          series = data.get(
              "Results",
              {}
          ).get(
              "series",
              []
          )

          for item in series:

              series_id = item.get(
                  "seriesID"
              )

              observations = item.get(
                  "data",
                  []
              )

              if not observations:
                  continue

              latest = observations[0]

              record = {
                  "value": latest.get("value"),
                  "year": latest.get("year"),
                  "period": latest.get("period")
              }

              if series_id == "CES0000000001":

                  result["nfp"] = record

              elif series_id == "LNS14000000":

                  result["unemployment"] = record

              elif series_id == "JTS000000000000000JOR":

                  result["jolts"] = record

          with open(
              "data/macro.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
