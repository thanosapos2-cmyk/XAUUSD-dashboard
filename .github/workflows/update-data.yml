name: Update Macro Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get BLS data
        shell: bash
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "seriesid": [
                "CES0000000001",
                "LNS14000000",
                "JTS000000000000000JOR",
                "ICSA"
              ],
              "startyear": "2026",
              "endyear": "2026"
            }' \
            "https://api.bls.gov/publicAPI/v2/timeseries/data/")

          echo "$RESPONSE" > bls_response.json

      - name: Get ADP data
        shell: bash
        run: |
          curl -L -s \
            "https://adpemploymentreport.com/" \
            -o adp_page.html

          python - <<'PY'
          import re
          import json

          with open("adp_page.html", "r", encoding="utf-8") as f:
              html = f.read()

          patterns = [
              r'Private employers added\s+([\d,]+)\s+jobs',
              r'private employment.*?([\d,]+)\s+jobs',
              r'added\s+([\d,]+)\s+jobs'
          ]

          value = None

          for pattern in patterns:
              match = re.search(pattern, html, re.I | re.S)

              if match:
                  value = int(match.group(1).replace(",", ""))
                  break

          adp = {
              "value": value,
              "source": "ADP National Employment Report"
          }

          with open("adp_data.json", "w") as f:
              json.dump(adp, f, indent=2)
          PY

      - name: Build macro.json
        shell: python
        run: |
          import json
          from datetime import datetime, timezone
          import os

          with open("bls_response.json", "r") as f:
              data = json.load(f)

          with open("adp_data.json", "r") as f:
              adp_data = json.load(f)

          os.makedirs("data", exist_ok=True)

          result = {
              "status": "live",

              "updated":
                  datetime.now(timezone.utc).isoformat(),

              "source": {
                  "bls": "https://www.bls.gov/",
                  "adp": "https://adpemploymentreport.com/",
                  "nfib": "https://www.nfib.com/"
              },

              "nfp": None,
              "unemployment": None,
              "jolts": None,
              "claims": None,

              "adp": adp_data,

              "nfib": {
                  "employment_index": 101.8,
                  "month": "August 2026",
                  "source": "NFIB Small Business Employment Index"
              },

              "ism": None,
              "indeed": None,

              "cpi": {
                  "mom": 0.36,
                  "core_mom": 0.19,
                  "yoy": 3.41,
                  "core_yoy": 2.32,
                  "source": "Cleveland Fed"
              }
          }

          series = data.get("Results", {}).get("series", [])

          for item in series:

              series_id = item.get("seriesID")
              observations = item.get("data", [])

              if not observations:
                  continue

              latest = observations[0]

              record = {
                  "value": latest.get("value"),
                  "year": latest.get("year"),
                  "period": latest.get("period")
              }

              if series_id == "CES0000000001":
                  result["nfp"] = record

              elif series_id == "LNS14000000":
                  result["unemployment"] = record

              elif series_id == "JTS000000000000000JOR":
                  result["jolts"] = record

              elif series_id == "ICSA":
                  result["claims"] = record

          with open("data/macro.json", "w") as f:
              json.dump(result, f, indent=2)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
