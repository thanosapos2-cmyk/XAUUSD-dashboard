name: Update Macro Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

concurrency:
  group: update-macro-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get BLS data
        shell: bash
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "seriesid": [
                "CES0000000001",
                "LNS14000000",
                "JTS00000000JOL",
                "ICSA"
              ],
              "startyear": "2026",
              "endyear": "2026"
            }' \
            "https://api.bls.gov/publicAPI/v2/timeseries/data/")

          echo "$RESPONSE" > bls_response.json

      - name: Get ADP data
        shell: bash
        run: |
          curl -L -s \
            "https://adpemploymentreport.com/" \
            -o adp_page.html

          python - <<'PY'
          import re
          import json

          with open("adp_page.html", "r", encoding="utf-8") as f:
              html = f.read()

          patterns = [
              r'Private employers added\s*([\d,]+)\s*jobs',
              r'Change in U\.S\. private employment[^0-9]*([\d,]+)'
          ]

          value = None

          for pattern in patterns:
              match = re.search(pattern, html, re.I | re.S)

              if match:
                  value = int(match.group(1).replace(",", ""))
                  break

          adp = {
              "value": value,
              "source": "ADP National Employment Report"
          }

          with open("adp_data.json", "w") as f:
              json.dump(adp, f, indent=2)
          PY

      - name: Build macro.json
        shell: python
        run: |
          import json
          from datetime import datetime, timezone

          with open("bls_response.json", "r") as f:
              data = json.load(f)

          with open("adp_data.json", "r") as f:
              adp_data = json.load(f)

          result = {
              "status": "live",

              "updated":
                  datetime.now(timezone.utc).isoformat(),

              "source": {
                  "bls": "https://www.bls.gov/",
                  "adp": "https://adpemploymentreport.com/",
                  "nfib": "https://www.nfib.com/"
              },

              "nfp": None,
              "unemployment": None,
              "jolts": None,
              "claims": None,

              "adp": adp_data,

              "nfib": {
                  "employment_index": 101.8,
                  "month": "August 2026",
                  "source": "NFIB Small Business Employment Index"
              },

              "ism": None,
              "indeed": None,

              "cpi": {
                  "mom": 0.36,
                  "core_mom": 0.19,
                  "yoy": 3.41,
                  "core_yoy": 2.32,
                  "source": "Cleveland Fed"
              }
          }

          series = data.get("Results", {}).get("series", [])

          for item in series:

              series_id = item.get("seriesID")
              observations = item.get("data", [])

              if not observations:
                  continue

              latest = observations[0]

              record = {
                  "value": latest.get("value"),
                  "year": latest.get("year"),
                  "period": latest.get("period")
              }

              if series_id == "CES0000000001":
                  result["nfp"] = record

              elif series_id == "LNS14000000":
                  result["unemployment"] = record

              elif series_id == "JTS00000000JOL":
                  result["jolts"] = record

              elif series_id == "ICSA":
                  result["claims"] = record

          with open("data/macro.json", "w") as f:
              json.dump(result, f, indent=2)

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/macro.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update macroeconomic data"

          for i in 1 2 3 4 5
          do
            echo "Push attempt $i..."

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi
            else
              echo "Rebase failed."
              git rebase --abort || true
            fi

            echo "Retrying in 5 seconds..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          exit 1
